<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(~{:: content})}">
<body>
<div th:fragment="content">

    <!-- Tab navigation -->
    <div class="flex gap-0 border-b border-slate-700 mb-6">
        <span class="px-5 py-2.5 text-sm font-semibold text-blue-400 border-b-2 border-blue-400 -mb-px">
            Search Criteria
        </span>
        <a th:href="@{/config/sites}"
           class="px-5 py-2.5 text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">
            Monitored Sites
        </a>
        <a th:href="@{/config/account}" class="px-5 py-2.5 text-sm text-slate-400 hover:text-slate-200 transition-colors">Account</a>
    </div>

    <div class="flex gap-6">

        <!-- Left column: saved search list -->
        <div class="flex-1 min-w-0">

            <!-- New search button -->
            <div class="mb-4">
                <a th:href="@{/config/search(edit='new')}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    New Search
                </a>
            </div>

            <!-- Empty state -->
            <div th:if="${configs.isEmpty()}"
                 class="bg-slate-800 rounded-xl p-8 text-center">
                <p class="text-slate-400 text-sm">No search configurations yet.</p>
                <p class="text-slate-500 text-xs mt-1">Click "+ New Search" to create one.</p>
            </div>

            <!-- Search config cards -->
            <div class="space-y-3">
                <div th:each="cfg : ${configs}"
                     class="bg-slate-800 rounded-xl p-4 border border-slate-700">

                    <!-- Top row: name + toggle + edit -->
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="font-semibold text-slate-100 truncate" th:text="${cfg.name}">Name</span>
                            <!-- Enabled badge -->
                            <span th:if="${cfg.enabled}"
                                  class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full bg-green-900/60 text-green-400">
                                Active
                            </span>
                            <span th:unless="${cfg.enabled}"
                                  class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full bg-slate-700 text-slate-400">
                                Paused
                            </span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <!-- Toggle button -->
                            <form th:action="@{/config/search/{id}/toggle(id=${cfg.id})}" method="post">
                                <button type="submit"
                                        th:text="${cfg.enabled} ? 'Pause' : 'Activate'"
                                        th:classappend="${cfg.enabled} ? 'bg-amber-700/40 text-amber-300 hover:bg-amber-700/60' : 'bg-green-700/40 text-green-300 hover:bg-green-700/60'"
                                        class="text-xs font-medium px-3 py-1 rounded-md transition-colors">
                                    Toggle
                                </button>
                            </form>
                            <!-- Edit link -->
                            <a th:href="@{/config/search(edit=${cfg.id})}"
                               class="text-xs font-medium px-3 py-1 rounded-md bg-slate-700 text-slate-300 hover:bg-slate-600 transition-colors">
                                Edit
                            </a>
                            <!-- Delete -->
                            <form th:action="@{/config/search/{id}/delete(id=${cfg.id})}" method="post"
                                  onsubmit="return confirm('Delete this search configuration?')">
                                <button type="submit"
                                        class="text-xs font-medium px-3 py-1 rounded-md bg-red-900/40 text-red-400 hover:bg-red-900/60 transition-colors">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Area tags -->
                    <div th:if="${cfg.areas != null and !cfg.areas.isEmpty()}"
                         class="flex flex-wrap gap-1.5 mb-2">
                        <span th:each="area : ${cfg.areas}"
                              class="text-xs px-2 py-0.5 bg-blue-900/50 text-blue-300 rounded-full"
                              th:text="${area}">Area</span>
                    </div>

                    <!-- Summary line: beds / price / baths -->
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400 mb-2">
                        <span th:if="${cfg.minBeds != null or cfg.maxBeds != null}">
                            Beds:
                            <span class="text-slate-300">
                                <span th:if="${cfg.minBeds != null}" th:text="${cfg.minBeds}">0</span>
                                <span th:if="${cfg.minBeds != null and cfg.maxBeds != null}">–</span>
                                <span th:if="${cfg.maxBeds != null}" th:text="${cfg.maxBeds}">0</span>
                                <span th:if="${cfg.minBeds != null and cfg.maxBeds == null}">+</span>
                            </span>
                        </span>
                        <span th:if="${cfg.minPrice != null or cfg.maxPrice != null}">
                            Price:
                            <span class="text-slate-300">
                                <span th:if="${cfg.minPrice != null}" th:text="'£' + ${cfg.minPrice}">£0</span>
                                <span th:if="${cfg.minPrice != null and cfg.maxPrice != null}">–</span>
                                <span th:if="${cfg.maxPrice != null}" th:text="'£' + ${cfg.maxPrice}">£0</span>
                            </span>
                        </span>
                        <span th:if="${cfg.minBaths != null}">
                            Baths: <span class="text-slate-300" th:text="${cfg.minBaths} + '+'">0+</span>
                        </span>
                        <span th:if="${cfg.furnishing != null and !cfg.furnishing.isEmpty()}">
                            Furnishing: <span class="text-slate-300" th:text="${#strings.listJoin(cfg.furnishing, ', ')}">-</span>
                        </span>
                    </div>

                    <!-- AI criteria -->
                    <p th:if="${cfg.additionalCriteria != null and !cfg.additionalCriteria.isBlank()}"
                       class="text-xs text-slate-500 italic truncate"
                       th:text="${cfg.additionalCriteria}">Additional criteria</p>
                </div>
            </div>
        </div>

        <!-- Right column: edit form (shown when editId is set) -->
        <div th:if="${editId != null}"
             class="w-96 shrink-0">
            <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 sticky top-6">
                <h2 class="text-base font-semibold text-slate-100 mb-4"
                    th:text="${editId == 'new'} ? 'New Search' : 'Edit Search'">Edit</h2>

                <form th:action="@{/config/search/save}" method="post" class="space-y-4">
                    <!-- Hidden id (blank for new) -->
                    <input type="hidden" name="id"
                           th:value="${editId == 'new'} ? '' : ${editId}"/>

                    <!-- Name -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Name</label>
                        <input type="text" name="name" required
                               th:value="${editConfig?.name}"
                               placeholder="e.g. Mayfair 2-bed"
                               class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                      placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                    </div>

                    <!-- Areas -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Areas <span class="text-slate-500">(comma-separated)</span></label>
                        <input type="text" name="areas"
                               th:value="${editConfig?.areas != null} ? ${#strings.listJoin(editConfig.areas, ', ')} : ''"
                               placeholder="e.g. Mayfair, Marylebone"
                               class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                      placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                    </div>

                    <!-- Beds row -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Min Beds</label>
                            <input type="number" name="minBeds" min="0" max="20"
                                   th:value="${editConfig?.minBeds}"
                                   placeholder="Any"
                                   class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                          placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Max Beds</label>
                            <input type="number" name="maxBeds" min="0" max="20"
                                   th:value="${editConfig?.maxBeds}"
                                   placeholder="Any"
                                   class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                          placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                        </div>
                    </div>

                    <!-- Price row -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Min Price (£/mo)</label>
                            <input type="number" name="minPrice" min="0"
                                   th:value="${editConfig?.minPrice}"
                                   placeholder="Any"
                                   class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                          placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Max Price (£/mo)</label>
                            <input type="number" name="maxPrice" min="0"
                                   th:value="${editConfig?.maxPrice}"
                                   placeholder="Any"
                                   class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                          placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                        </div>
                    </div>

                    <!-- Min baths -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Min Baths</label>
                        <input type="number" name="minBaths" min="0" max="10"
                               th:value="${editConfig?.minBaths}"
                               placeholder="Any"
                               class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                      placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                    </div>

                    <!-- Furnishing checkboxes -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2">Furnishing</label>
                        <div class="space-y-1.5">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="furnishing" value="Furnished"
                                       th:checked="${editConfig?.furnishing != null and editConfig.furnishing.contains('Furnished')}"
                                       class="w-4 h-4 accent-blue-500 bg-slate-700 border-slate-600 rounded"/>
                                <span class="text-sm text-slate-300">Furnished</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="furnishing" value="Part-furnished"
                                       th:checked="${editConfig?.furnishing != null and editConfig.furnishing.contains('Part-furnished')}"
                                       class="w-4 h-4 accent-blue-500 bg-slate-700 border-slate-600 rounded"/>
                                <span class="text-sm text-slate-300">Part-furnished</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="furnishing" value="Unfurnished"
                                       th:checked="${editConfig?.furnishing != null and editConfig.furnishing.contains('Unfurnished')}"
                                       class="w-4 h-4 accent-blue-500 bg-slate-700 border-slate-600 rounded"/>
                                <span class="text-sm text-slate-300">Unfurnished</span>
                            </label>
                        </div>
                    </div>

                    <!-- Additional criteria -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Additional Criteria <span class="text-slate-500">(AI instructions)</span></label>
                        <textarea name="additionalCriteria" rows="3"
                                  th:text="${editConfig?.additionalCriteria}"
                                  placeholder="e.g. Must have a private garden, close to tube..."
                                  class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                         placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-2 pt-1">
                        <button type="submit"
                                class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
                            Save
                        </button>
                        <a th:href="@{/config/search}"
                           class="flex-1 py-2 text-center bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium rounded-lg transition-colors">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>

    </div>

</div>
</body>
</html>
