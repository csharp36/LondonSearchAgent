<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(~{:: content})}">
<body>
<div th:fragment="content">

    <!-- Tab navigation -->
    <div class="flex gap-0 border-b border-slate-700 mb-6">
        <a th:href="@{/config/search}"
           class="px-5 py-2.5 text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">
            Search Criteria
        </a>
        <span class="px-5 py-2.5 text-sm font-semibold text-blue-400 border-b-2 border-blue-400 -mb-px">
            Monitored Sites
        </span>
    </div>

    <!-- Add site form -->
    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 mb-6">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide mb-4">Add Site</h2>
        <form th:action="@{/config/sites/add}" method="post">
            <div class="flex flex-wrap gap-3 items-end">
                <!-- Name -->
                <div class="flex-1 min-w-40">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Name</label>
                    <input type="text" name="name" required
                           placeholder="e.g. Rightmove"
                           class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                  placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                </div>
                <!-- URL -->
                <div class="flex-[2] min-w-56">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Base URL</label>
                    <input type="url" name="baseUrl" required
                           placeholder="https://www.rightmove.co.uk"
                           class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                  placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
                </div>
                <!-- Type dropdown -->
                <div class="w-44">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Type</label>
                    <select name="scraperType"
                            class="w-full px-3 py-2 bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg
                                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        <option value="static">static</option>
                        <option value="js-rendered">js-rendered</option>
                        <option value="authenticated">authenticated</option>
                    </select>
                </div>
                <!-- Submit -->
                <div class="shrink-0">
                    <button type="submit"
                            class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
                        Add Site
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Sites table -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">

        <!-- Empty state -->
        <div th:if="${sites.isEmpty()}" class="p-8 text-center">
            <p class="text-slate-400 text-sm">No monitored sites configured.</p>
            <p class="text-slate-500 text-xs mt-1">Use the form above to add a site.</p>
        </div>

        <!-- Table -->
        <table th:unless="${sites.isEmpty()}" class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-700">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Site</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">URL</th>
                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Type</th>
                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Tier</th>
                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
                    <th class="text-right px-5 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="site, stat : ${sites}"
                    th:classappend="${!stat.last} ? 'border-b border-slate-700' : ''"
                    class="hover:bg-slate-700/30 transition-colors">

                    <!-- Site name -->
                    <td class="px-5 py-3.5 font-medium text-slate-100" th:text="${site.name}">Name</td>

                    <!-- URL -->
                    <td class="px-5 py-3.5 max-w-xs">
                        <a th:if="${site.baseUrl != null}"
                           th:href="${site.baseUrl}"
                           th:text="${site.baseUrl}"
                           target="_blank" rel="noopener noreferrer"
                           class="text-blue-400 hover:text-blue-300 transition-colors truncate block max-w-[220px]">URL</a>
                        <span th:unless="${site.baseUrl != null}" class="text-slate-500">—</span>
                    </td>

                    <!-- Type badge -->
                    <td class="px-4 py-3.5">
                        <span th:text="${site.scraperType}"
                              th:classappend="${site.scraperType == 'authenticated'} ? 'bg-purple-900/50 text-purple-300' :
                                             (${site.scraperType == 'js-rendered'} ? 'bg-amber-900/50 text-amber-300' : 'bg-slate-700 text-slate-300')"
                              class="text-xs font-medium px-2 py-0.5 rounded-full">type</span>
                    </td>

                    <!-- Tier -->
                    <td class="px-4 py-3.5 text-slate-400" th:text="${site.tier} ?: '—'">—</td>

                    <!-- Status toggle -->
                    <td class="px-4 py-3.5">
                        <form th:action="@{/config/sites/{id}/toggle(id=${site.id})}" method="post" class="inline">
                            <button type="submit"
                                    th:text="${site.enabled} ? 'Active' : 'Paused'"
                                    th:classappend="${site.enabled} ? 'bg-green-900/50 text-green-400 hover:bg-green-900/70' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'"
                                    class="text-xs font-medium px-3 py-1 rounded-full transition-colors">
                                Status
                            </button>
                        </form>
                    </td>

                    <!-- Actions -->
                    <td class="px-5 py-3.5 text-right">
                        <form th:action="@{/config/sites/{id}/delete(id=${site.id})}" method="post" class="inline"
                              onsubmit="return confirm('Remove this site?')">
                            <button type="submit"
                                    class="text-xs font-medium px-3 py-1 rounded-md bg-red-900/40 text-red-400 hover:bg-red-900/60 transition-colors">
                                Remove
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
