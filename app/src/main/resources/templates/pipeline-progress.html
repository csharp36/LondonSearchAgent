<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(~{:: content})}">
<body>
<div th:fragment="content">

    <div class="max-w-2xl mx-auto py-8">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-100 mb-2">Scanning Properties</h1>
            <p class="text-slate-400 text-sm">Checking all monitored estate agent sites for new listings...</p>
        </div>

        <!-- Progress bar -->
        <div class="bg-slate-800 rounded-xl p-6 mb-6">
            <div class="flex items-center justify-between mb-3">
                <span id="progress-label" class="text-sm text-slate-300 font-medium">Starting...</span>
                <span id="progress-count" class="text-sm text-slate-500">0 / 0 sites</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <!-- Stats cards -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-800 rounded-xl p-4 text-center">
                <span class="text-xs text-slate-400 block mb-1">New Properties</span>
                <span id="stat-new" class="text-2xl font-bold text-green-400">0</span>
            </div>
            <div class="bg-slate-800 rounded-xl p-4 text-center">
                <span class="text-xs text-slate-400 block mb-1">Updated</span>
                <span id="stat-updated" class="text-2xl font-bold text-blue-400">0</span>
            </div>
        </div>

        <!-- Site results log -->
        <div class="bg-slate-800 rounded-xl p-4">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">Site Results</h2>
            <div id="site-log" class="space-y-1 max-h-64 overflow-y-auto text-sm font-mono">
                <p class="text-slate-500 italic">Waiting...</p>
            </div>
        </div>

        <!-- Done actions (hidden until complete) -->
        <div id="done-actions" class="mt-6 flex gap-3 justify-center" style="display: none;">
            <a href="/" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
                View Properties
            </a>
            <a href="/config/search" class="px-6 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium rounded-lg transition-colors">
                Back to Settings
            </a>
        </div>

    </div>

    <script th:inline="javascript">
        (function() {
            const bar = document.getElementById('progress-bar');
            const label = document.getElementById('progress-label');
            const count = document.getElementById('progress-count');
            const statNew = document.getElementById('stat-new');
            const statUpdated = document.getElementById('stat-updated');
            const siteLog = document.getElementById('site-log');
            const doneActions = document.getElementById('done-actions');
            let started = false;

            function poll() {
                fetch('/agent/progress')
                    .then(r => r.json())
                    .then(data => {
                        const pct = data.sitesTotal > 0
                            ? Math.round((data.sitesProcessed / data.sitesTotal) * 100)
                            : 0;
                        bar.style.width = pct + '%';
                        count.textContent = data.sitesProcessed + ' / ' + data.sitesTotal + ' sites';
                        statNew.textContent = data.newProperties;
                        statUpdated.textContent = data.updatedProperties;

                        if (data.phase === 'running') {
                            label.textContent = data.currentSite
                                ? 'Scanning ' + data.currentSite + '...'
                                : 'Starting pipeline...';
                            bar.classList.remove('bg-green-500', 'bg-red-500');
                            bar.classList.add('bg-blue-500');
                        } else if (data.phase === 'complete') {
                            label.textContent = 'Complete!';
                            bar.style.width = '100%';
                            bar.classList.remove('bg-blue-500');
                            bar.classList.add('bg-green-500');
                            doneActions.style.display = 'flex';
                        } else if (data.phase === 'error') {
                            label.textContent = 'Error: ' + (data.error || 'unknown');
                            bar.classList.remove('bg-blue-500');
                            bar.classList.add('bg-red-500');
                            doneActions.style.display = 'flex';
                        }

                        // Update site log
                        if (data.siteResults && data.siteResults.length > 0) {
                            siteLog.innerHTML = data.siteResults.map(function(r) {
                                const isError = r.includes('error');
                                const isSkip = r.includes('skipped');
                                const cls = isError ? 'text-red-400' : isSkip ? 'text-slate-500' : 'text-slate-300';
                                return '<p class="' + cls + '">' + r.replace(/</g, '&lt;') + '</p>';
                            }).join('');
                            siteLog.scrollTop = siteLog.scrollHeight;
                        }

                        if (data.phase === 'running' || (data.phase === 'idle' && !started)) {
                            setTimeout(poll, 1500);
                        }
                    })
                    .catch(function() {
                        setTimeout(poll, 3000);
                    });
            }

            // Kick off the pipeline
            fetch('/agent/run-async', { method: 'POST' })
                .then(r => r.json())
                .then(function(data) {
                    started = true;
                    if (data.status === 'already_running') {
                        label.textContent = 'Pipeline already running...';
                    }
                    poll();
                })
                .catch(function() {
                    label.textContent = 'Failed to start pipeline';
                });
        })();
    </script>

</div>
</body>
</html>
